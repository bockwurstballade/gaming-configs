// =======================================================
//   CALL OF DUTY 1 AUTOEXEC.CFG
//   Optimized for competitive / esports play
// =======================================================
//
// Usually place this file here:
//
// Steam version:
//   C:\Program Files (x86)\Steam\steamapps\common\Call of Duty\Main\
//
// Retail / CD version:
//   C:\Program Files (x86)\Call of Duty\Main\
//
// Linux:
//   ~/.callofduty/main/
//
// Mac OS X:
//   ~/Library/Application Support/Call of Duty/Main/
//
// It will automatically be executed every time the game starts.


// =========================
//   MOUSE & INPUT
// =========================
seta sensitivity "2.0"            // Sets overall mouse sensitivity
seta m_pitch "0.022"              // Vertical sensitivity scale (keep same as yaw)
seta m_yaw "0.022"                // Horizontal sensitivity scale
seta cl_mouseAccel "0"            // Disables mouse acceleration for consistency
seta in_mouse "1"                 // Enables raw mouse input
seta m_filter "0"                 // Disables mouse smoothing for precision


// =========================
//   DISPLAY SETTINGS
// =========================
seta r_mode "-1"                  // Enables custom resolution mode
seta r_customwidth "1920"         // Custom width (adjust to your monitor)
seta r_customheight "1080"        // Custom height
seta r_fullscreen "1"             // Enables fullscreen
seta r_displayrefresh "144"       // Match monitor refresh rate
seta r_swapInterval "0"           // Disables VSync (reduces input lag)


// =========================
//   GRAPHICS SETTINGS
// =========================
seta com_maxfps "250"             // Limits FPS to 250 for consistent frame timing
seta r_picmip "3"                 // Lowers texture detail (higher = blurrier, better visibility)
seta r_gamma "1.4"                // Brightens the scene for visibility
seta r_overBrightBits "1"         // Increases brightness for enemies and map
seta cg_brass "0"                 // Disables shell ejection for performance
seta cg_blood "0"                 // Disables blood effects (cleaner visuals)
seta cg_drawGun "0"               // Hides weapon model to see more screen
seta cg_marks "0"                 // Disables bullet hole decals
seta cg_shadows "0"               // Disables shadows for clarity
seta r_dynamiclight "0"           // Disables dynamic lighting for performance
seta r_fastsky "1"                // Simplifies sky rendering for FPS boost


// =========================
//   NETWORK SETTINGS
// =========================
seta rate "25000"                 // Data rate for stable net performance
seta cl_maxpackets "100"          // Number of packets sent per second
seta snaps "30"                   // Snapshot rate (match server tickrate)
seta cl_packetdup "0"             // Disable packet duplication
seta cl_timenudge "-5"            // Slight prediction tweak (use carefully)


// =========================
//   HUD & FIELD OF VIEW
// =========================
seta cg_fov "80"                  // Default FOV (try 90 for widescreen play)
seta cg_drawFPS "1"               // Shows current FPS counter
seta cg_lagometer "1"             // Shows network lag graph
seta cg_drawCompass "1"           // Enables compass HUD
seta cg_draw2D "1"                // Enables 2D HUD elements


// =========================
//   CROSSHAIR & VIEW
// =========================
seta cg_crosshairAlpha "1"        // Crosshair opacity
seta cg_crosshairSize "20"        // Crosshair size
seta cg_crosshairColor "green"    // Crosshair color (white, green, red, blue, etc.)
seta cg_crosshairAlphaPulse "0"   // Disables pulsing effect when firing
seta cg_crosshairHealth "0"       // Keeps crosshair color static on damage


// =========================
//   PLAYER MODEL & NAME
// =========================
seta name "YourNickname"          // Sets your in-game player name
                                  // Supports Quake 3-style color codes (^1 = red, etc.)
seta cl_freelook "1"              // Enables free mouse look
seta cl_pitchspeed "140"          // Look speed when moving mouse vertically
seta cl_yawspeed "140"            // Look speed horizontally


// =========================
//   AUDIO SETTINGS
// =========================
seta s_volume "0.8"               // Master sound volume
seta s_musicvolume "0"            // Turns off music for focus
seta s_doppler "0"                // Disables Doppler effect
seta s_khz "44"                   // High sound quality (44kHz)


// =========================
//   CONTROLS (EXAMPLES)
// =========================
unbindall                         // Clears all previous binds to avoid conflicts

bind w "+forward"                 // Move forward
bind s "+back"                    // Move backward
bind a "+moveleft"                // Strafe left
bind d "+moveright"               // Strafe right
bind SPACE "+moveup"              // Jump
bind CTRL "+movedown"             // Crouch
bind SHIFT "+speed"               // Sprint
bind MOUSE1 "+attack"             // Fire weapon
bind MOUSE2 "+aim"                // Iron sights / aim down sights
bind R "+reload"                  // Reload weapon
bind G "weapnext"                 // Switch to next weapon
bind Q "weapprev"                 // Switch to previous weapon
bind F "use"                      // Use/interact
bind TAB "+scores"                // Show scoreboard


// =========================
//   MISCELLANEOUS
// =========================
exec custom_aliases.cfg           // Executes custom alias file if it exists
echo "autoexec.cfg successfully loaded for Call of Duty 1!"  // Prints message on load
