// usually, this file should be placed in the following folder or Steam Version
// C:\Program Files (x86)\Steam\steamapps\common\Quake Live\baseq3\
// then, this file will be automatically executed every time quake live is starting up

// for non-steam versions, this could be different
// Windows Vista or Older:
// %AppData%\..\LocalLow\id Software\quakelive\home\baseq3

// Windows XP:
// %appdata%\id Software\quakelive\home\baseq3

// GNU/Linux:
// ~/.quakelive/quakelive/home/baseq3/

// Mac OS X:
// ~/Library/Application\ Support/Quakelive/


// =========================
//   QUAKE LIVE AUTOEXEC
//   Optimized for competitive play
// =========================

// =========================
//   QUAKE LIVE AUTOEXEC
//   Optimized for competitive play
// =========================

// --- MOUSE & MOVEMENT ---
sensitivity 2.0            // Sets overall mouse sensitivity
m_yaw 0.022                // Horizontal mouse sensitivity scale. Most People keep horizontal and vertical the same.
m_pitch 0.022              // Vertical mouse sensitivity scale. Most People keep horizontal and vertical the same.
cl_mouseAccel 0            // Disables mouse acceleration for consistent aim
in_mouse "2"
m_filter  0

// --- DISPLAY SETTINGS ---
r_mode -1                  // Enables custom resolution mode
r_customwidth 1920         // Sets custom screen width (adjust to your setup)
r_customheight 1080        // Sets custom screen height (adjust to your setup)
r_fullscreen 1             // Enables fullscreen mode
r_displayrefresh 144       // set to match Hertz frequency of your monitor. Should also be set that way on windows level.
// --- GRAPHICS SETTINGS ---
r_picmip 16                 // Lowers texture detail for better visibility
r_dynamiclight 0           // Disables dynamic lighting for performance and clarity
r_vertexlighting 0            // Disabled vertex lighting
r_lightmap 1
r_mapoverbrightbits 1
r_overbrightbits 1
r_intensity 1
cg_kickScale "0"
cg_muzzleFlash "0" // Disables gun muzzle flash
cg_screenDamage "0"
cl_timenudge "-2"
cg_simpleitems 1 // Disables 3D models for items and instead just shows 2D icons
r_enablePostProcess
cg_bubbleTrail


// --- FRAMERATE & PERFORMANCE ---
com_maxfps 250             // Caps framerate at 250 FPS for stable input timing
r_swapinterval 0           // Disables VSync for lower input lag

// --- NETWORK SETTINGS ---
rate 25000                 // Sets data rate (max allowed by Quake Live)
cl_maxpackets 125          // Sets number of packets per second for smoother netcode
snaps 40                   // Sets snapshot rate from the server
cl_packetdup 0             // Prevents packet duplication for lower latency

// --- FIELD OF VIEW & HUD ---
cg_fov 110                 // Sets field of view (110 is common for competitive play)
cg_drawGun 0               // Hides weapon model for better visibility
cg_drawFPS 1               // Shows current FPS counter
cg_lagometer 1             // Displays network lag graph

// --- CROSSHAIR SETTINGS ---
cg_crosshairSize 24        // Sets crosshair size
cg_crosshairColor 7        // Crosshair color (7 = white)
cg_crosshairAlpha 1        // Crosshair transparency (1 = solid)
cg_crosshairHealth 0       // Disables crosshair color change on damage

// --- BRIGHTNESS & VISIBILITY ---
r_gamma 1.4                // Adjusts brightness (higher = brighter)
r_overBrightBits 1         // Makes bright areas even brighter
r_mapOverBrightBits 2      // Increases overall map brightness

// --- PLAYER MODEL & COLORS ---
model keel/bright          // Uses bright green Keel model (commonly used in esports)
color1 0                   // Primary color (0 = green)
color2 7                   // Secondary color (7 = white)


// you can have your controls setup in a separate file, e. g. controls.cfg
// and exec it via "exec controls.cfg" at the bottom of thsi file.
// So the below bindings are just an example.
// --- WEAPON BINDS ---
bind 1 "use Gauntlet"          // Binds key 1 to Gauntlet
bind 2 "use Machinegun"        // Binds key 2 to Machinegun
bind 3 "use Shotgun"           // Binds key 3 to Shotgun
bind 4 "use Grenade Launcher"  // Binds key 4 to Grenade Launcher
bind 5 "use Rocket Launcher"   // Binds key 5 to Rocket Launcher
bind 6 "use Lightning Gun"     // Binds key 6 to Lightning Gun
bind 7 "use Railgun"           // Binds key 7 to Railgun
bind 8 "use Plasma Gun"        // Binds key 8 to Plasma Gun

// --- MOVEMENT KEYS ---
bind w "+forward"          // Move forward
bind s "+back"             // Move backward
bind a "+moveleft"         // Strafe left
bind d "+moveright"        // Strafe right
bind SPACE "+moveup"       // Jump
bind CTRL "+movedown"      // Crouch

// --- SOUND SETTINGS ---
s_volume 0.8               // Master volume
s_musicvolume 0            // Turns off music for better focus
s_ambient 0                // Disables ambient sounds
cg_allowtaunt 0            // Disabled taunt sounds

// --- MISCELLANEOUS ---
name "YourNickname"        // Sets your in-game player name (replace with your own)
                           // see https://quake3world.com/forum/viewtopic.php?t=7760 on how to paint nickname
unbindall                  // Clears all existing keybinds before applying new ones
exec custom_aliases.cfg    // Executes custom alias file if it exists
echo "autoexec.cfg successfully loaded!"  // Prints message when config loads
